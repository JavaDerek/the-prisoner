<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask Muse</title>
<style>
  :root { --bg:#faf9f7; --panel:#fff; --ink:#1b1a18; --dim:#6b6862; --line:#e3e0da; --accent:#2b4c7e; --warn:#a01b2b; }
  * { box-sizing: border-box; }
  body { margin:0; padding:20px 16px 60px; background:var(--bg); color:var(--ink);
         font:15px/1.55 ui-sans-serif,-apple-system,"Segoe UI",system-ui,sans-serif; }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 { font-size:21px; margin:0 0 4px; }
  .sub { color:var(--dim); font-size:13px; margin-bottom:18px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:14px 16px; margin-bottom:14px; }
  label { display:block; font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); margin-bottom:6px; }
  textarea, input, select { width:100%; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:13px;
    border:1px solid var(--line); border-radius:6px; padding:9px 10px; background:#fff; color:var(--ink); }
  textarea { resize:vertical; line-height:1.5; }
  #prompt { min-height:150px; }
  #system { min-height:52px; }
  .row { display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; }
  .row > div { flex:1 1 150px; }
  .row > div.narrow { flex:0 0 auto; }
  button { font:inherit; font-size:14px; border:1px solid var(--accent); background:var(--accent); color:#fff;
           border-radius:6px; padding:8px 16px; cursor:pointer; }
  button.ghost { background:#fff; color:var(--accent); }
  button:disabled { opacity:.5; cursor:default; }
  pre { white-space:pre-wrap; word-wrap:break-word; font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
        font-size:13px; line-height:1.5; margin:0; }
  .answer { background:#fff; border:1px solid var(--line); border-left:3px solid var(--accent); border-radius:6px; padding:12px 14px; }
  details { margin-top:10px; }
  summary { cursor:pointer; font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); }
  details pre { margin-top:8px; color:var(--dim); font-size:12px; }
  .meta { font-size:12px; color:var(--dim); margin-top:8px; }
  .err { color:var(--warn); }
  .hist { border-top:1px solid var(--line); padding-top:12px; margin-top:12px; }
  .hist .q { font-size:13px; font-weight:600; margin-bottom:4px; }
  .status { font-size:12px; color:var(--dim); }
  .status b { color:var(--ink); }
</style>
</head>
<body>
<div class="wrap">
<h1>Ask Muse</h1>
<p class="sub">
  A bare harness onto <code>Muse-Glimmer-30B</code> Q4_K_M, served by llama.cpp on doris:11435 —
  the referee Phase 1 batch 3 ran on. One user message per ask, nothing remembered between asks.
  <span id="status" class="status"></span>
</p>

<div class="panel">
  <label for="system">System prompt (optional — the game sends none)</label>
  <textarea id="system" placeholder="leave empty to match the game"></textarea>
</div>

<div class="panel">
  <label for="prompt">Your question</label>
  <textarea id="prompt" placeholder="Ask anything."></textarea>
  <div class="row" style="margin-top:10px">
    <div class="narrow"><button id="ask">Ask</button></div>
    <div class="narrow"><button class="ghost" id="stop" disabled>Stop</button></div>
    <div>
      <label for="think">Reasoning</label>
      <select id="think">
        <option value="high">high (the model's default)</option>
        <option value="none">none (what batch 3 used)</option>
        <option value="low">low</option>
        <option value="medium">medium</option>
      </select>
    </div>
    <div>
      <label for="temp">Temperature</label>
      <input id="temp" type="number" step="0.1" min="0" max="2" value="0">
    </div>
    <div>
      <label for="maxtok">Max tokens</label>
      <input id="maxtok" type="number" step="128" min="16" value="2048">
    </div>
  </div>
  <div class="row" style="margin-top:10px">
    <div><input id="ep" value="http://doris:11435/v1/chat/completions"></div>
    <div><input id="model" value="muse-glimmer-30b-q4_k_m"></div>
  </div>
</div>

<div id="out"></div>
</div>

<script>
const el = (id) => document.getElementById(id);
let controller = null;

check();
async function check() {
  try {
    const r = await fetch("http://doris:11435/v1/models", { cache: "no-store" });
    el("status").innerHTML = r.ok ? "— server <b>up</b>" : "— server answered " + r.status;
  } catch (e) {
    el("status").innerHTML = '— server <b class="err">not reachable</b>. On doris: ' +
      "<code>cd ~/llamacpp/llama-b11130 &amp;&amp; ./llama-server -m ~/models/Muse-Glimmer-30B-Q4_K_M.gguf " +
      "--host 0.0.0.0 --port 11435 -c 16384 -ngl 999 --flash-attn on --jinja</code>";
  }
}

el("stop").onclick = () => { if (controller) controller.abort(); };
el("prompt").addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") el("ask").click();
});

el("ask").onclick = async () => {
  const q = el("prompt").value.trim();
  if (!q) return;
  el("ask").disabled = true; el("stop").disabled = false;
  controller = new AbortController();

  const messages = [];
  const sys = el("system").value.trim();
  if (sys) messages.push({ role: "system", content: sys });
  messages.push({ role: "user", content: q });

  const body = {
    model: el("model").value,
    messages,
    temperature: Number(el("temp").value),
    max_tokens: Number(el("maxtok").value),
    stream: false,
    chat_template_kwargs: { reasoning_strength: el("think").value },
  };

  const card = document.createElement("div");
  card.className = "panel";
  card.innerHTML = `<div class="q">${escapeHtml(q).replace(/\n/g, "<br>")}</div><p class="meta">thinking…</p>`;
  el("out").prepend(card);

  const t0 = performance.now();
  try {
    const res = await fetch(el("ep").value, {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify(body), signal: controller.signal,
    });
    const json = await res.json();
    const ms = Math.round(performance.now() - t0);
    if (!res.ok) throw new Error(JSON.stringify(json).slice(0, 400));
    const msg = json.choices?.[0]?.message ?? {};
    const usage = json.usage ?? {};
    const tps = usage.completion_tokens && ms ? Math.round((usage.completion_tokens / ms) * 1000) : null;
    card.innerHTML = `
      <div class="q">${escapeHtml(q).replace(/\n/g, "<br>")}</div>
      <div class="answer"><pre>${escapeHtml(msg.content ?? "(no content)")}</pre></div>
      ${msg.reasoning_content ? `<details><summary>reasoning (${msg.reasoning_content.length} chars)</summary><pre>${escapeHtml(msg.reasoning_content)}</pre></details>` : ""}
      <details><summary>raw request</summary><pre>${escapeHtml(JSON.stringify(body, null, 1))}</pre></details>
      <p class="meta">${(ms / 1000).toFixed(1)}s · ${usage.prompt_tokens ?? "?"} in / ${usage.completion_tokens ?? "?"} out${tps ? ` · ${tps} tok/s` : ""} · reasoning ${el("think").value} · temp ${el("temp").value}</p>`;
  } catch (e) {
    card.innerHTML = `<div class="q">${escapeHtml(q).replace(/\n/g, "<br>")}</div>
      <p class="meta err">${escapeHtml(String(e))}</p>`;
  } finally {
    el("ask").disabled = false; el("stop").disabled = true; controller = null;
  }
};

function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}
</script>
</body>
</html>
